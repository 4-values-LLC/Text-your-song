{% extends "base.html" %}
{% block content %}
<section class="card">
    <h1>Suno produziert deinen Remix …</h1>
    <p>Das Audio wird hochgeladen und an Suno übergeben. Die Generierung dauert
       in der Regel ein bis zwei Minuten.</p>
    <div hx-get="/job/{{ job_id }}/remix-status"
         hx-trigger="load, every 3s"
         hx-swap="innerHTML">
        <div class="progress"><div class="bar" style="width:0%"></div></div>
    </div>
</section>
{% endblock %}
